name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit -p .
      - name: Tests (engine + golden checks from the organizers' statements)
        run: npm test
      - name: Verify (audit chain, quotes, engine reproduces lookups.json, negative control)
        run: npm run verify
      - name: Build
        run: npx next build
